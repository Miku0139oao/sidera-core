name: Test

on:
  push:
    branches:
      - main
      - stable
      - testing
      - unstable
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/test.yml'
  pull_request:
    branches:
      - main
      - stable
      - testing
      - unstable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        go:
          - ~1.24
          - ~1.25
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            test/go.sum
      - name: Set build tags and ldflags
        shell: bash
        run: |
          echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS),with_3xui_import" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"
      - name: Test (unix)
        if: matrix.os != 'windows-latest'
        run: go test -v -exec sudo -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./...
      - name: Test (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -p 1 -v -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./...
      - name: Compile integration tests
        shell: bash
        working-directory: test
        run: go test -mod=readonly -c -o "$RUNNER_TEMP/sidera-integration.test" -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" .

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache-dependency-path: go.sum
      - name: Set build flags
        shell: bash
        run: |
          echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS),with_3xui_import" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"
      - name: Test race-sensitive packages
        run: go test -count=1 -race -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./adapter/service ./service/api ./cmd/sidera .

  fuzz:
    name: Fuzz smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache-dependency-path: go.sum
      - name: Fuzz QUIC sniffer
        run: go test ./common/sniff -run '^$' -fuzz '^FuzzSniffQUIC$' -fuzztime=20s
      - name: Fuzz STUN sniffer
        run: go test ./common/sniff -run '^$' -fuzz '^FuzzSniffSTUN$' -fuzztime=20s

  benchmark:
    name: Dashboard benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache-dependency-path: go.sum
      - name: Run repeatable dashboard benchmarks
        shell: bash
        run: |
          set -o pipefail
          go test ./service/api -run '^TestAdminAccountViewsAllocationBudget$' \
            -bench '^BenchmarkAdmin(AccountViews|MembershipPolicyUsage)$' \
            -benchmem -benchtime=1s -count=5 | tee benchmark.txt
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-benchmark
          path: benchmark.txt

  windows-integration:
    name: Windows privileged integration
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache-dependency-path: go.sum
      - name: Set build flags
        shell: bash
        run: |
          echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS),integration" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"
      - name: Test WinDivert and TLS spoofing
        shell: bash
        run: go test -count=1 -v -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./common/windivert ./common/tlsspoof
